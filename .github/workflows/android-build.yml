name: AetherPS3 CI

on:
  push:
    branches: ["main", "milestone-2", "milestone-3-ui", "aetherps3-rebuild"]
  pull_request:
    branches: ["main", "milestone-2", "milestone-3-ui", "aetherps3-rebuild"]
  workflow_dispatch:

jobs:
  native-tests:
    name: Native core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DANDROIDPS3_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest
    needs: native-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK/NDK/CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherps3-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
